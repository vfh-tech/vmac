[project]
name = "vmac"
version = "1.0.3"
description = "MCP Memory Bank Server dengan SQLite terisolasi"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "mcp[cli]>=1.27.1",
]

[project.scripts]
vmac = "mcp_memory_bank_server:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["mcp_memory_bank_server.py"]
